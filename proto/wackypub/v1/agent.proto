syntax = "proto3";

package wackypub.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/colinrgodsey/wackypub/pkg/agent/v1;agentv1";

// AgentService defines the interface of record for WackyPub agent operations (D112).
//
// In v1, this interface is consumed strictly in-process through generated Go types
// and interfaces; no network transport (gRPC/HTTP), network listener, or remote daemon
// is deployed or required. The protobuf definition serves as the canonical contract
// defining operation semantics, data models, and migration boundaries for the WackyPub
// agent lifecycle.
//
// D112 establishes a unified 26-method service interface replacing the legacy monolithic
// AgentSDK methods across five staged rollout phases:
//   - Phase 1: Read-only workspace queries and state inspection (7 methods:
//     ListAgents, InspectAgent, ReadSession, ReadMemory, RenderSystemPrompt,
//     InspectSessionContext, InspectAgentLocks).
//   - Phase 3: Stateful mutations (AddUserTurn, AddMedia, CancelTurn, StripSignatures,
//     CompactSession) and scratchpad CRUD (CreateScratchpad, GetScratchpad, ListScratchpads,
//     SearchScratchpad, DiffScratchpadEntries, DeleteScratchpad).
//   - Phase 4 (current): Side-effectful / background operations (Trace).
//   - Phase 5: Complete cutover and deprecation/removal of legacy SDK entry points.
//
// Design Decisions:
//   - Q1: Go code generation produces interface stubs (AgentServiceServer) embedded directly
//     into AgentSDK without network overhead.
//   - Q2: Protobuf service definitions are the sole source of truth for method signatures
//     and wire structures, replacing ad-hoc Go structs.
//   - Q5: Staged migration permits progressive implementation and contract testing while
//     keeping existing CLI workflows fully backward-compatible.
service AgentService {
  // ListAgents discovers and returns the identifiers of all agent directories present
  // directly under the specified workspace root. An agent directory is recognized if it
  // contains the marker file (AGENTS.md). Callers invoke this method during workspace
  // discovery, multi-agent orchestration, or status reporting. If the workspace directory
  // does not exist or contains no valid agent directories, an empty list is returned without error.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);

  // InspectAgent performs an extensive diagnostic audit of an agent directory's filesystem state.
  // Callers invoke this method to determine configuration completeness, file presence, allowlists,
  // discovered tools and skills, and session corruption statistics without triggering agent execution
  // or modifying on-disk state. This call intentionally avoids acquiring session locks to prevent
  // self-deadlocks when called by an agent inspecting itself mid-turn. If the target agent directory
  // does not exist, the response sets agent_dir_exists to false with all remaining fields zero-valued.
  rpc InspectAgent(InspectAgentRequest) returns (InspectAgentResponse);

  // ReadSession reads and returns the full conversational turn history stored in the agent's
  // session.jsonl file. Callers use this method to inspect past user/model interactions, replay
  // conversations, or audit transcripts. In v1, turns and content parts are converted to SessionTurn
  // structures containing plain text and inline data; tool invocations (FunctionCall and FunctionResponse)
  // are omitted under accepted-lossy v1 conversion. If session.jsonl does not exist, an empty list
  // of turns is returned without error.
  rpc ReadSession(ReadSessionRequest) returns (ReadSessionResponse);

  // ReadMemory retrieves the raw markdown content of the agent's long-term memory notes from
  // MEMORY.md. Callers use this method to read persistent memories across sessions. Read access
  // is subject to workspace allowlist authorization against the target agent. If MEMORY.md does
  // not exist, an empty string is returned without error.
  rpc ReadMemory(ReadMemoryRequest) returns (ReadMemoryResponse);

  // RenderSystemPrompt renders the agent's complete system prompt from AGENTS.md, expanding
  // any macro inclusion directives (@<FILE_PATH>) into their referenced file contents. Callers
  // use this method to view or feed the actual prompt passed to the model backend during generation.
  // Returns an error if AGENTS.md cannot be read or if cyclic macro references are detected.
  rpc RenderSystemPrompt(RenderSystemPromptRequest) returns (RenderSystemPromptResponse);

  // InspectSessionContext calculates current token usage, context window limits, and auto-compaction
  // headroom for an agent per D93/D101. Callers invoke this method to monitor context window consumption,
  // plan proactive compaction, or display diagnostics. It estimates token counts across session turns,
  // the rendered system prompt, and memory files, returning headroom percentages and the most recent turn
  // token metrics if available.
  rpc InspectSessionContext(InspectSessionContextRequest) returns (InspectSessionContextResponse);

  // InspectAgentLocks surveys all agent directories in the workspace and returns lock status and session
  // activity for each agent per D100. Callers invoke this method to detect active agent executions, identify
  // stale lock files left behind by dead processes, or debug concurrency contention. The lock file outlives
  // release, so lock presence alone does not imply held; callers must check holder_pid_valid, holder_alive,
  // and last_write.
  rpc InspectAgentLocks(InspectAgentLocksRequest) returns (InspectAgentLocksResponse);

  // AddUserTurn appends a new user message turn to the agent's conversational session history (session.jsonl).
  // Automatically creates the agent directory if it does not yet exist. Executes configured user message
  // lifecycle hooks before committing the turn, returning any non-fatal hook warnings alongside the committed turn.
  // Acquires the agent's exclusive session lock for the duration of the append.
  rpc AddUserTurn(AddUserTurnRequest) returns (AddUserTurnResponse);

  // AddMedia attaches a binary image payload to the agent's conversational session history (session.jsonl).
  // The image bytes are validated, normalized, and resized to JPEG format according to maxImageDimension
  // in runtime.json per D47. Payloads exceeding the 10MB ceiling (MaxMediaPayloadBytes) are rejected outright.
  // Acquires the agent's exclusive session lock for the duration of the operation.
  rpc AddMedia(AddMediaRequest) returns (AddMediaResponse);

  // CancelTurn cancels an active in-flight turn for the specified agent (D85).
  // Safe to invoke concurrently from any goroutine. Returns an error if no turn is currently
  // active for the specified agent.
  rpc CancelTurn(CancelTurnRequest) returns (CancelTurnResponse);

  // StripSignatures strips provider-specific opaque reasoning/thought signatures (such as Gemini's
  // ThoughtSignature or OpenRouter reasoning_details) from all turns in session.jsonl, rewriting the file
  // in place. Readable plain-text reasoning is preserved. Useful when switching an agent between LLM
  // providers where replaying previous provider signatures causes rejection. Acquires the session lock.
  rpc StripSignatures(StripSignaturesRequest) returns (StripSignaturesResponse);

  // CompactSession evaluates and triggers session compaction on an agent's history (D44, D83, D84).
  // Summarizes the oldest turns (default 50%, or compact_pct in COMPACT.md) into MEMORY.md and removes
  // them from session.jsonl. Callers can force compaction (bypassing token headroom thresholds), provide
  // an in-memory CompactConfig override, or specify an alternative runtime configuration path.
  // Acquires the exclusive session lock for the duration of compaction.
  rpc CompactSession(CompactSessionRequest) returns (CompactSessionResponse);

  // CreateScratchpad writes a new entry to the agent's scratchpad store (<workspace_dir>/<agent_id>/scratchpad/).
  // Performs atomic creation and enforces store capacity limits (MaxScratchpadEntries). Does not require the
  // session lock.
  rpc CreateScratchpad(CreateScratchpadRequest) returns (CreateScratchpadResponse);

  // GetScratchpad retrieves the text content of a specific scratchpad entry from the agent's scratchpad store.
  // Supports optional pagination via skip_lines and num_lines. Does not require the session lock.
  rpc GetScratchpad(GetScratchpadRequest) returns (GetScratchpadResponse);

  // ListScratchpads lists metadata for all scratchpad entries present in the agent's scratchpad store.
  // Returns entries ordered chronologically along with current capacity metrics. Does not require the session lock.
  rpc ListScratchpads(ListScratchpadsRequest) returns (ListScratchpadsResponse);

  // SearchScratchpad searches the text of a specific scratchpad entry for matching lines.
  // Supports case-sensitivity toggles, regular expressions, and result limits. Rejects binary entries.
  // Does not require the session lock.
  rpc SearchScratchpad(SearchScratchpadRequest) returns (SearchScratchpadResponse);

  // DiffScratchpadEntries computes and returns a unified diff between two scratchpad entries for an agent.
  // Returns an empty diff string if both entries are byte-identical. Does not require the session lock.
  rpc DiffScratchpadEntries(DiffScratchpadEntriesRequest) returns (DiffScratchpadEntriesResponse);

  // DeleteScratchpad removes a scratchpad entry from the agent's scratchpad store by its identifier.
  // Enforces workspace allowlist authorization.
  rpc DeleteScratchpad(DeleteScratchpadRequest) returns (DeleteScratchpadResponse);


  // GenerateTurnStream generates the next assistant turn for an agent whose session
  // already contains pending history, streaming text chunks to the caller as the model
  // produces them. The request carries no user message - the turn continues from whatever
  // is already in session.jsonl (e.g. a turn queued by AddUserTurn). It holds the session
  // lock for the entire stream, and the stream is cancelled when the caller stops iterating
  // or the context expires.
  rpc GenerateTurnStream(GenerateTurnStreamRequest) returns (stream GenerateTurnStreamResponse);

  // GenerateTurn is the non-streaming twin of GenerateTurnStream: it runs the same
  // generation path and returns the complete assistant text joined across chunks.
  rpc GenerateTurn(GenerateTurnRequest) returns (GenerateTurnResponse);

  // AddAndGenerateTurnStream atomically appends a user message to the agent session and
  // streams the assistant response chunks as they are generated, under a single session
  // lock. Hook execution warnings are carried on the chunk stream itself (a chunk with
  // warning set and empty text) so in-process consumers do not need a Go-only callback.
  rpc AddAndGenerateTurnStream(AddAndGenerateTurnStreamRequest) returns (stream AddAndGenerateTurnStreamResponse);

  // AddAndGenerateTurn is the non-streaming twin of AddAndGenerateTurnStream: it appends
  // the user message, runs the full generation, and returns the complete assistant text
  // plus any hook warnings on the response.
  rpc AddAndGenerateTurn(AddAndGenerateTurnRequest) returns (AddAndGenerateTurnResponse);

  // AsideQuestion answers a one-shot question against a forked, in-memory copy of the agent's
  // session (D45 disposable-session shape). The aside model sees the agent's tool declarations
  // (cache-prefix identity preserved) but tool INVOCATION is denied - a functionCall yields a
  // completable denial, never an execution. The main agent session is byte-identical after the
  // call: no session.jsonl append, no MEMORY.md update, no scratchpad writes, no workspace
  // git/trace events, no post-turn hooks, no compaction self-trigger. No exclusive session lock
  // is acquired (copy-on-read snapshot), so an aside never blocks a live turn. Usage is returned
  // as metadata only, never written to session state.
  rpc AsideQuestion(AsideQuestionRequest) returns (AsideQuestionResponse);

  // Trace performs backward causal graph traversal starting from an agent's git commit or a global
  // correlation trace identifier (D36). Callers invoke this method to audit cross-agent workflows,
  // inspect multi-hop turn histories, and reconstruct causal chains. The request uses a oneof to enforce
  // that callers specify either an agent commit specifier or a trace ID.
  rpc Trace(TraceRequest) returns (TraceResponse);
}

// ListAgentsRequest specifies parameters for listing agent directories in a workspace.
message ListAgentsRequest {
  // workspace_dir is the filesystem path to the workspace root to inspect.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 1;
}

// ListAgentsResponse returns the discovered agent identifiers.
message ListAgentsResponse {
  // agent_ids contains the subdirectory names of all valid agent directories discovered
  // directly under the workspace root (directories containing AGENTS.md).
  repeated string agent_ids = 1;
}

// InspectAgentRequest specifies parameters for inspecting an individual agent directory.
message InspectAgentRequest {
  // agent_id identifies the agent directory to inspect (<workspace_dir>/<agent_id>). Required.
  string agent_id = 1;

  // workspace_dir is the filesystem path to the workspace root containing the agent directory.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 2;
}

// InspectAgentResponse reports the complete on-disk configuration and diagnostic state of an agent.
// All fields reflect filesystem observations at the time of inspection. To avoid exposing sensitive
// credentials (such as LLM API keys), structured runtime configurations are not exported here; callers
// can rely on the boolean and error indicators to confirm whether runtime.json is present and valid.
message InspectAgentResponse {
  // agent_id is the identifier of the inspected agent.
  string agent_id = 1;

  // agent_dir is the absolute filesystem path to the agent's directory.
  string agent_dir = 2;

  // agent_dir_exists indicates whether the directory <workspace_dir>/<agent_id> exists on disk.
  // When false, all subsequent fields remain zero-valued.
  bool agent_dir_exists = 3;

  // agents_md_exists indicates whether AGENTS.md (system prompt template) exists in the agent directory.
  bool agents_md_exists = 4;

  // memory_md_exists indicates whether MEMORY.md (long-term memory) exists in the agent directory.
  bool memory_md_exists = 5;

  // dot_env_exists indicates whether .env exists in the agent directory.
  bool dot_env_exists = 6;

  // runtime_json_exists indicates whether runtime.json exists in the agent directory.
  bool runtime_json_exists = 7;

  // runtime_json_is_symlink indicates whether runtime.json is a symbolic link.
  bool runtime_json_is_symlink = 8;

  // runtime_json_resolved contains the resolved canonical path when runtime_json_is_symlink is true.
  string runtime_json_resolved = 9;

  // runtime_json_valid indicates whether runtime.json successfully parsed into a valid runtime configuration.
  bool runtime_json_valid = 10;

  // runtime_json_error contains the parse or validation error message if runtime_json_exists is true but valid is false.
  string runtime_json_error = 11;

  // Field 12 previously held AgentRuntimeConfig runtime_config, which was removed because it exposed
  // sensitive API keys (api_key) in cleartext and duplicated the validation signals above.
  reserved 12;
  reserved "runtime_config";

  // session_jsonl_exists indicates whether session.jsonl exists in the agent directory.
  bool session_jsonl_exists = 13;

  // session_turn_count is the number of conversation turns successfully parsed from session.jsonl.
  int32 session_turn_count = 14;

  // session_corrupt_lines is the count of non-empty lines in session.jsonl skipped due to JSON parse failures.
  int32 session_corrupt_lines = 15;

  // allowed_agents_exists indicates whether .allowed_agents exists in the agent directory.
  bool allowed_agents_exists = 16;

  // allowed_agents lists the agent IDs permitted for cross-agent communication if allowed_agents_exists is true.
  repeated string allowed_agents = 17;

  // tools_dir_exists indicates whether the tools/ subdirectory exists in the agent directory.
  bool tools_dir_exists = 18;

  // discovered_tools contains the names of executable tools discovered in tools/.
  repeated string discovered_tools = 19;

  // shadowed_tools contains warning messages for any tool names shadowed by higher-precedence tools.
  repeated string shadowed_tools = 20;

  // skills_dir_exists indicates whether the skills/ subdirectory exists in the agent directory.
  bool skills_dir_exists = 21;

  // discovered_skills contains the names of valid skills discovered in skills/.
  repeated string discovered_skills = 22;

  // shadowed_skills contains warning messages for any skill names shadowed by higher-precedence skills.
  repeated string shadowed_skills = 23;
}

// ReadSessionRequest specifies parameters for reading an agent's conversational turns.
message ReadSessionRequest {
  // agent_id identifies the agent whose session turns should be read. Required.
  string agent_id = 1;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 2;
}

// ReadSessionResponse contains the parsed conversation turns from session.jsonl.
message ReadSessionResponse {
  // turns contains every conversation turn recorded in session.jsonl in chronological order.
  repeated SessionTurn turns = 1;
}

// SessionTurn represents a single conversational turn in session.jsonl.
message SessionTurn {
  // role identifies the author of the turn, typically "user" or "model".
  string role = 1;

  // parts contains the ordered sequence of content parts comprising this turn.
  repeated SessionPart parts = 2;
}

// SessionPart represents one content component of a conversation turn (text or inline data).
//
// NOTE(D112 v1): In v1, SessionPart models plain text and inline data parts. Non-text parts
// such as tool invocations (FunctionCall and FunctionResponse) stored in session.jsonl are
// omitted during conversion. This lossy conversion is accepted for v1; this protobuf interface
// is canonical going forward, and richer part schemas may be introduced in a future revision.
message SessionPart {
  // text contains the plain text content of this part, if applicable.
  string text = 1;

  // inline_data contains raw binary data for media attachments (e.g. image payloads).
  bytes inline_data = 2;

  // mime_type specifies the MIME media type of inline_data (e.g. "image/png").
  string mime_type = 3;
}

// ReadMemoryRequest specifies parameters for reading an agent's long-term memory.
message ReadMemoryRequest {
  // agent_id identifies the agent whose MEMORY.md should be read. Required.
  string agent_id = 1;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 2;
}

// ReadMemoryResponse returns the contents of MEMORY.md.
message ReadMemoryResponse {
  // memory_md contains the raw markdown text stored in <workspace_dir>/<agent_id>/MEMORY.md.
  // Empty if the file does not exist.
  string memory_md = 1;
}

// RenderSystemPromptRequest specifies parameters for rendering an agent's system prompt.
message RenderSystemPromptRequest {
  // agent_id identifies the agent whose system prompt should be rendered. Required.
  string agent_id = 1;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 2;
}

// RenderSystemPromptResponse returns the rendered system prompt.
message RenderSystemPromptResponse {
  // rendered_prompt contains the prompt from AGENTS.md after expanding all @<FILE_PATH> macros.
  string rendered_prompt = 1;
}

// InspectSessionContextRequest specifies parameters for inspecting session token usage and headroom.
message InspectSessionContextRequest {
  // agent_id identifies the agent whose session context should be analyzed. Required.
  string agent_id = 1;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 2;
}

// InspectSessionContextResponse reports token estimation metrics, compaction limits, and headroom.
message InspectSessionContextResponse {
  // agent_id is the identifier of the analyzed agent.
  string agent_id = 1;

  // model is the LLM model identifier configured in runtime.json (e.g. "gemini-2.5-flash").
  string model = 2;

  // context_window is the total maximum token capacity configured for the model.
  int32 context_window = 3;

  // compaction_threshold is the calculated token count that triggers automatic session compaction.
  int32 compaction_threshold = 4;

  // compaction_overhead_pct is the safety buffer percentage reserved before context limit (e.g. 20.0).
  double compaction_overhead_pct = 5;

  // estimated_total_tokens is the sum of estimated session turns and prompt tokens.
  int32 estimated_total_tokens = 6;

  // session_turns_tokens is the estimated token count consumed by turns in session.jsonl.
  int32 session_turns_tokens = 7;

  // prompt_tokens_estimate is the estimated token count of the rendered system prompt.
  int32 prompt_tokens_estimate = 8;

  // memory_tokens_estimate is the estimated token count of MEMORY.md content.
  int32 memory_tokens_estimate = 9;

  // percent_to_threshold is the percentage of the compaction threshold utilized (0.0 to 100.0+).
  double percent_to_threshold = 10;

  // percent_to_window is the percentage of the full context window utilized (0.0 to 100.0+).
  double percent_to_window = 11;

  // turn_count is the total number of turns parsed from session.jsonl.
  int32 turn_count = 12;

  // compacted indicates whether the last generation turn resulted in session compaction.
  bool compacted = 13;

  // last_prompt_tokens is the provider-reported input prompt tokens from the last non-compacted turn.
  int32 last_prompt_tokens = 14;

  // last_candidates_tokens is the provider-reported output tokens from the last non-compacted turn.
  int32 last_candidates_tokens = 15;

  // last_total_tokens is the provider-reported total tokens from the last non-compacted turn.
  int32 last_total_tokens = 16;
}

// InspectAgentLocksRequest specifies parameters for inspecting workspace agent session locks.
message InspectAgentLocksRequest {
  // workspace_dir is the filesystem path to the workspace root to inspect.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 1;
}

// InspectAgentLocksResponse contains session lock observations for all agents in the workspace.
message InspectAgentLocksResponse {
  // observations contains one lock observation per discovered agent directory in the workspace.
  repeated AgentLockObservation observations = 1;
}

// AgentLockObservation captures a read-only snapshot of an agent directory's session lock and activity.
message AgentLockObservation {
  // agent_id is the identifier of the agent.
  string agent_id = 1;

  // agent_dir is the filesystem path to the agent directory.
  string agent_dir = 2;

  // lock_exists indicates whether <agent_dir>/session.lock is present on disk.
  // Note: lock files are not deleted on release, so presence does not imply the lock is currently held.
  bool lock_exists = 3;

  // holder_pid is the process ID recorded in the lock file by the last acquiring process, or 0 if absent/unparseable.
  int32 holder_pid = 4;

  // holder_pid_valid indicates whether holder_pid was successfully parsed from the lock file.
  bool holder_pid_valid = 5;

  // holder_alive indicates whether the process identified by holder_pid is currently running.
  bool holder_alive = 6;

  // holder_command contains the sanitized command line of the process holding the lock (credentials redacted).
  string holder_command = 7;

  // lock_held_since is the modification timestamp of session.lock, reflecting when the holder acquired the lock.
  google.protobuf.Timestamp lock_held_since = 8;

  // session_exists indicates whether <agent_dir>/session.jsonl is present on disk.
  bool session_exists = 9;

  // last_write is the modification timestamp of session.jsonl, reflecting the most recent session activity.
  google.protobuf.Timestamp last_write = 10;
}

// AddUserTurnRequest specifies parameters for appending a user message turn.
message AddUserTurnRequest {
  // agent_id identifies the agent whose session history will receive the user turn. Required.
  string agent_id = 1;

  // message contains the user's text message to append to the session. Required.
  string message = 2;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 3;
}

// AddUserTurnResponse returns the appended session turn and processing details.
message AddUserTurnResponse {
  // turn contains the session turn appended to session.jsonl.
  SessionTurn turn = 1;

  // text contains the final processed message text after hook execution and macro expansion.
  string text = 2;

  // warnings contains non-fatal diagnostic or hook execution warnings generated during the operation.
  repeated string warnings = 3;

  // usage contains token consumption metrics if user turn processing consumed tokens (D116).
  TurnUsage usage = 4;
}

// AddMediaRequest specifies parameters for attaching a binary media payload to an agent session.
message AddMediaRequest {
  // agent_id identifies the agent whose session history will receive the media attachment. Required.
  string agent_id = 1;

  // media_data contains the raw binary bytes of the image file to attach (max 10MB). Required.
  bytes media_data = 2;

  // mime_type optionally specifies the MIME media type of media_data (e.g. "image/png").
  // If empty, MIME type is detected from the media payload header.
  string mime_type = 3;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 4;
}

// AddMediaResponse returns details of the attached media turn.
message AddMediaResponse {
  // turn contains the user-role session turn appended to session.jsonl with the inline media attachment.
  SessionTurn turn = 1;

  // mime_type is the normalized MIME type of the stored attachment (e.g. "image/jpeg").
  string mime_type = 2;

  // raw_size is the byte count of the processed and stored media payload.
  int64 raw_size = 3;
}

// CancelTurnRequest specifies the target agent whose active turn should be cancelled.
message CancelTurnRequest {
  // agent_id identifies the agent whose in-flight turn should be cancelled. Required.
  string agent_id = 1;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 2;
}

// CancelTurnResponse acknowledges successful cancellation of the active turn.
message CancelTurnResponse {}

// StripSignaturesRequest specifies the target agent whose session signatures should be stripped.
message StripSignaturesRequest {
  // agent_id identifies the agent whose session signatures should be stripped. Required.
  string agent_id = 1;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 2;
}

// StripSignaturesResponse reports the number of turns modified during signature stripping.
message StripSignaturesResponse {
  // modified_turns is the count of conversation turns that were modified and rewritten.
  int32 modified_turns = 1;
}

// CompactSessionRequest specifies parameters for triggering session compaction.
message CompactSessionRequest {
  // agent_id identifies the agent whose session should be compacted. Required.
  string agent_id = 1;

  // force bypasses token threshold checks and forces compaction even if context limits have not been reached.
  bool force = 2;

  // config_override optionally overrides the agent's COMPACT.md configuration without modifying on-disk files.
  CompactConfigOverride config_override = 3;

  // runtime_path optionally specifies an alternative runtime.json path to use for compaction execution (D84).
  string runtime_path = 4;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 5;
}

// CompactConfigOverride specifies in-memory parameter overrides for session compaction (D83).
message CompactConfigOverride {
  // append_only specifies whether persistent memory updates should be append-only.
  bool append_only = 1;

  // compact_pct is the fraction of turns to compact (0.0 to 1.0, e.g. 0.5 for 50%).
  double compact_pct = 2;

  // compact_overhead_pct is the safety buffer percentage before the context limit.
  double compact_overhead_pct = 3;

  // compaction_notice is the text notice injected into the session after compaction.
  string compaction_notice = 4;

  // prompt is an optional custom compaction prompt override.
  string prompt = 5;
}

// CompactSessionResponse reports whether session compaction occurred.
message CompactSessionResponse {
  // compacted indicates whether session compaction actually executed (false if session was empty or skipped).
  bool compacted = 1;
}

// CreateScratchpadRequest specifies parameters for creating a new scratchpad entry.
message CreateScratchpadRequest {
  // agent_id identifies the agent whose scratchpad store will receive the entry. Required.
  string agent_id = 1;

  // text contains the content to store in the scratchpad entry. Required.
  string text = 2;

  // created_by identifies the author or tool that created the entry (e.g. "cli"). Defaults to "cli".
  string created_by = 3;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 4;
}

// CreateScratchpadResponse returns metadata for the newly created scratchpad entry.
message CreateScratchpadResponse {
  // entry contains metadata describing the newly created scratchpad entry.
  ScratchpadEntry entry = 1;
}

// ScratchpadEntry represents a stored scratchpad record in <workspace_dir>/<agent_id>/scratchpad/.
message ScratchpadEntry {
  // entry_id is the unique 4-character alphanumeric identifier of the scratchpad entry.
  string entry_id = 1;

  // size is the content size in bytes.
  int64 size = 2;

  // lines is the line count of the text content.
  int32 lines = 3;

  // created_by identifies the author or tool that created the entry.
  string created_by = 4;

  // text contains the stored entry text, if populated.
  string text = 5;

  // is_binary indicates whether the entry contains binary data.
  bool is_binary = 6;

  // mime_type is the detected MIME type of the entry.
  string mime_type = 7;

  // warnings contains any non-fatal warnings generated during entry creation or retrieval.
  repeated string warnings = 8;
}

// GetScratchpadRequest specifies parameters for retrieving a scratchpad entry's text content.
message GetScratchpadRequest {
  // agent_id identifies the agent owning the scratchpad entry. Required.
  string agent_id = 1;

  // entry_id is the 4-character identifier of the scratchpad entry to read. Required.
  string entry_id = 2;

  // skip_lines specifies the number of leading lines to skip (0-indexed). Optional.
  optional int32 skip_lines = 3;

  // num_lines specifies the maximum number of lines to return. Optional.
  optional int32 num_lines = 4;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 5;
}

// GetScratchpadResponse returns the retrieved scratchpad content.
message GetScratchpadResponse {
  // text contains the retrieved scratchpad content (or requested line range).
  string text = 1;
}

// ListScratchpadsRequest specifies parameters for listing scratchpad entries.
message ListScratchpadsRequest {
  // agent_id identifies the agent whose scratchpad store to inspect. Required.
  string agent_id = 1;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 2;
}

// ListScratchpadsResponse returns all active scratchpad entries and store capacity metrics.
message ListScratchpadsResponse {
  // entries contains metadata for each scratchpad entry found in the store.
  repeated ScratchpadEntry entries = 1;

  // total_entries is the count of active entries currently in the store.
  int32 total_entries = 2;

  // max_capacity is the maximum entry limit before eviction occurs (MaxScratchpadEntries).
  int32 max_capacity = 3;
}

// SearchScratchpadRequest specifies parameters for searching within a scratchpad entry.
message SearchScratchpadRequest {
  // agent_id identifies the agent owning the scratchpad entry. Required.
  string agent_id = 1;

  // entry_id is the 4-character identifier of the scratchpad entry to search. Required.
  string entry_id = 2;

  // query is the text string or regex pattern to search for. Required.
  string query = 3;

  // case_sensitive specifies whether matching is case-sensitive (defaults to true if unset).
  optional bool case_sensitive = 4;

  // use_regex specifies whether query should be evaluated as a regular expression.
  bool use_regex = 5;

  // max_results limits the number of matches returned (default 50 if <= 0).
  int32 max_results = 6;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 7;
}

// SearchScratchpadResponse returns line match results within the searched scratchpad entry.
message SearchScratchpadResponse {
  // entry_id is the identifier of the searched scratchpad entry.
  string entry_id = 1;

  // query is the query that was searched.
  string query = 2;

  // total_matches is the total number of matching lines found.
  int32 total_matches = 3;

  // max_results is the effective maximum results limit applied.
  int32 max_results = 4;

  // matches contains the individual line match results.
  repeated ScratchpadMatch matches = 5;
}

// ScratchpadMatch captures a single matching line in a scratchpad search.
message ScratchpadMatch {
  // line is the 1-based line number in the scratchpad entry.
  int32 line = 1;

  // skip_lines is the 0-based offset for retrieving this match via GetScratchpad.
  int32 skip_lines = 2;

  // text is the matching line content.
  string text = 3;
}

// DiffScratchpadEntriesRequest specifies parameters for computing a diff between two scratchpad entries.
message DiffScratchpadEntriesRequest {
  // agent_id identifies the agent owning both scratchpad entries. Required.
  string agent_id = 1;

  // before_entry_id is the identifier of the base/original scratchpad entry. Required.
  string before_entry_id = 2;

  // after_entry_id is the identifier of the target/modified scratchpad entry. Required.
  string after_entry_id = 3;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 4;
}

// DiffScratchpadEntriesResponse returns the unified diff between two scratchpad entries.
message DiffScratchpadEntriesResponse {
  // diff contains the unified diff output comparing the two entries, or empty if identical.
  string diff = 1;
}

// DeleteScratchpadRequest specifies parameters for deleting a scratchpad entry.
message DeleteScratchpadRequest {
  // agent_id identifies the agent whose scratchpad entry will be deleted. Required.
  string agent_id = 1;

  // entry_id is the 4-character identifier of the scratchpad entry to delete. Required.
  string entry_id = 2;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 3;
}

// DeleteScratchpadResponse acknowledges successful deletion of the scratchpad entry.
message DeleteScratchpadResponse {}

message GenerateTurnStreamRequest {
  // agent_id identifies the agent whose session should be generated. Required.
  string agent_id = 1;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 2;
}

// TurnUsage contains token consumption metrics and backend attribution for an execution turn (D116).
message TurnUsage {
  // prompt_tokens is the count of input/context tokens consumed for the turn.
  int64 prompt_tokens = 1;

  // completion_tokens is the count of output/candidate tokens generated during the turn.
  int64 completion_tokens = 2;

  // total_tokens is the sum of prompt_tokens and completion_tokens.
  int64 total_tokens = 3;

  // backend identifies the bridge, harness, or execution engine that produced the turn.
  string backend = 4;
}

// ToolCall announces a tool invocation that is about to run (the ACP tool_call mirror).
// It carries a stable call_id so the matching ToolCallUpdate can be paired with it, the
// tool name, and a REDACTED scalar preview of the arguments - never full argument bodies
// on the wire (secret-shaped values are removed before summary is built).
message ToolCall {
  // call_id is the stable identifier pairing this announce with its ToolCallUpdate.
  string call_id = 1;

  // tool_name is the tool's registered name (e.g. create_scratchpad, bash).
  string tool_name = 2;

  // args_summary is a redacted scalar preview of the invocation arguments, truncated to
  // ~200 chars. Secret-shaped values (api keys, tokens, passwords, bearer headers) are
  // removed before this summary is built; the full args live only in the session/tool
  // journal on disk.
  string args_summary = 3;

  // denied is true when the invocation was refused before execution (compaction/aside
  // deny paths emit the same announce shape with denied=true and no update).
  bool denied = 4;
}

// ToolCallUpdate reports the outcome of a previously announced ToolCall (the ACP
// tool_call_update mirror). It carries byte-size + truncated head + a store/session
// reference for the FULL result - never the full body on the wire.
message ToolCallUpdate {
  // call_id pairs this update with the ToolCall that announced it.
  string call_id = 1;

  // tool_name is the tool's registered name (echoed from the announce).
  string tool_name = 2;

  // status is one of completed | error | denied.
  string status = 3;

  // result_bytes is the byte size of the full tool result (0 when status != completed).
  int64 result_bytes = 4;

  // result_head is a truncated head of the result text (<=256 bytes) for live display.
  string result_head = 5;

  // result_ref is a store/session reference for the full result body (see journal
  // stamping). May be empty when the result had no persisted body.
  string result_ref = 6;
}

// GenerateTurnStreamResponse is a single streamed slice of the assistant response text
// for GenerateTurnStream.
message GenerateTurnStreamResponse {
  // text is the next chunk of generated assistant content.
  string text = 1;

  // usage carries token consumption metrics for the turn when emitted as the final chunk (D116).
  TurnUsage usage = 2;

  // tool_call announces a tool invocation (additive; empty when the response carries text).
  ToolCall tool_call = 3;

  // tool_call_update reports a tool invocation outcome (additive; empty when not present).
  ToolCallUpdate tool_call_update = 4;
}

// GenerateTurnRequest specifies parameters for the non-streaming generate twin.
message GenerateTurnRequest {
  // agent_id identifies the agent whose session should be generated. Required.
  string agent_id = 1;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 2;
}

// GenerateTurnResponse returns the complete assistant text for a generate call.
message GenerateTurnResponse {
  // text is the full assistant response joined across streamed chunks.
  string text = 1;

  // usage contains token consumption metrics and backend attribution for the turn (D116).
  TurnUsage usage = 2;
}

// AddAndGenerateTurnStreamRequest specifies parameters for appending a user message and
// streaming the assistant response.
message AddAndGenerateTurnStreamRequest {
  // agent_id identifies the agent to drive. Required.
  string agent_id = 1;

  // user_message is the user turn text to append before generation starts. Required.
  string user_message = 2;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 3;
}

// AddAndGenerateTurnStreamResponse is one streamed unit of an add-and-generate turn: either
// a text chunk of the assistant response, or a hook warning surfaced out-of-band.
message AddAndGenerateTurnStreamResponse {
  // text is the next chunk of generated assistant content (empty when warning/tool event is set).
  string text = 1;

  // warning carries a hook execution warning for this turn (empty when text is set).
  string warning = 2;

  // usage carries token consumption metrics for the turn when emitted as the final chunk (D116).
  TurnUsage usage = 3;

  // tool_call announces a tool invocation (additive; empty when the response carries text).
  ToolCall tool_call = 4;

  // tool_call_update reports a tool invocation outcome (additive; empty when not present).
  ToolCallUpdate tool_call_update = 5;
}

// AddAndGenerateTurnRequest specifies parameters for the non-streaming add-and-generate twin.
message AddAndGenerateTurnRequest {
  // agent_id identifies the agent to drive. Required.
  string agent_id = 1;

  // user_message is the user turn text to append before generation starts. Required.
  string user_message = 2;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 3;
}

// AddAndGenerateTurnResponse returns the complete assistant text and any hook warnings.
message AddAndGenerateTurnResponse {
  // text is the full assistant response joined across streamed chunks.
  string text = 1;

  // warnings are hook execution warnings collected during the turn.
  repeated string warnings = 2;

  // usage contains token consumption metrics and backend attribution for the turn (D116).
  TurnUsage usage = 3;
}

// AsideQuestionRequest specifies parameters for a one-shot aside question.
message AsideQuestionRequest {
  // agent_id identifies the agent whose session context the aside draws on. Required.
  string agent_id = 1;

  // question is the one-shot question to answer against the forked session. Required.
  string question = 2;

  // workspace_dir is the filesystem path to the workspace root containing the agent.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 3;
}

// AsideQuestionResponse returns the complete aside answer plus metadata. Nothing about the
// aside is persisted anywhere; the main session is byte-identical after the call.
message AsideQuestionResponse {
  // text is the full aside answer joined across generated chunks.
  string text = 1;

  // warnings are non-fatal diagnostics surfaced during the aside (e.g. fallback notes).
  repeated string warnings = 2;

  // tool_denials counts how many tool invocations the aside model attempted and were denied.
  int64 tool_denials = 3;

  // usage contains token consumption billed to the aside turn (metadata only, never persisted).
  TurnUsage usage = 4;
}

// A2AMetadata represents minified Agent2Agent context propagated across agent calls (D33).
message A2AMetadata {
  // caller_id is the identifier of the calling agent that initiated the request.
  string caller_id = 1;

  // call_chain contains the ordered chain of agent IDs participating in the call sequence.
  repeated string call_chain = 2;

  // trace_id is the causal correlation trace identifier.
  string trace_id = 3;

  // metadata contains arbitrary key-value context attributes propagated across hops.
  map<string, string> metadata = 4;
}

// TraceStep represents a single hop in the backward causal trace chain.
message TraceStep {
  // step_index is the 1-based sequential hop index in the causal trace.
  int32 step_index = 1;

  // agent_id identifies the agent repository where this commit occurred.
  string agent_id = 2;

  // commit_sha is the full 40-character git commit object hash.
  string commit_sha = 3;

  // short_sha is the abbreviated 7-character commit hash prefix.
  string short_sha = 4;

  // event_type is the classified event category (e.g. user, model, system, compaction).
  string event_type = 5;

  // a2a_metadata contains the parsed Agent2Agent context if present in the commit message.
  A2AMetadata a2a_metadata = 6;

  // raw_commit_message contains the complete raw git commit message body.
  string raw_commit_message = 7;

  // turn_contents contains the session turns added or modified at this commit.
  repeated SessionTurn turn_contents = 8;
}

// TraceRequest specifies parameters for backward causal tracing through git history.
message TraceRequest {
  // agent_id identifies the agent whose git history to trace.
  // Required when commit_spec is specified.
  string agent_id = 1;

  // workspace_dir is the filesystem path to the workspace root containing the agent repositories.
  // When empty, the SDK's configured default workspace directory is used.
  string workspace_dir = 2;

  // max_steps is the maximum number of causal trace hops to traverse backward (default 20).
  int32 max_steps = 3;

  // verbosity is the formatting verbosity level from 0 to 4 (default 1).
  int32 verbosity = 4;

  // target specifies whether to trace from an agent's commit or from a global trace identifier.
  // Exactly one target must be set.
  oneof target {
    // commit_spec is the git commit hash, prefix, suffix, branch, tag, or revision (e.g. HEAD~1).
    string commit_spec = 5;

    // trace_id is the global correlation trace ID across agent causal chains (e.g. a2a-12345).
    string trace_id = 6;
  }
}

// TraceResponse returns the ordered sequence of causal steps discovered by the trace.
message TraceResponse {
  // target_agent_id is the agent where the trace originated (when tracing by commit).
  string target_agent_id = 1;

  // target_commit is the resolved initial commit SHA where the trace originated.
  string target_commit = 2;

  // trace_id is the causal trace ID (when tracing by trace ID or parsed from root commit).
  string trace_id = 3;

  // steps contains the ordered causal steps traversed backward in time.
  repeated TraceStep steps = 4;
}
